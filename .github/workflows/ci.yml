name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  testes:
    name: Checks e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      - name: Gerar SECRET_KEY temporária (só para esta execução)
        run: echo "SECRET_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(48))')" >> "$GITHUB_ENV"

      - name: System check
        run: python manage.py check

      - name: Migrações pendentes
        run: python manage.py makemigrations --check --dry-run

      - name: Testes
        run: python manage.py test

  auditoria:
    name: Auditoria de dependências
    runs-on: ubuntu-latest
    # Informativo: uma vulnerabilidade nova publicada hoje não deve bloquear o merge,
    # mas precisa aparecer no resultado da execução para ser tratada.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pip-audit
      - run: pip-audit -r requirements.txt
